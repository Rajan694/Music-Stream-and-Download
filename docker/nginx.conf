server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vite content-hashes asset filenames, so they can be cached forever.
    # No `expires` here: it emits its own Cache-Control and the response would
    # carry the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry point must never be cached, or a client keeps loading an old
    # bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: client-side routes like /playlist/:id are not real files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

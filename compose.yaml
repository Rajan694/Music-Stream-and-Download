name: music-stream

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Backs both the metadata cache and the BullMQ download queue. No maxmemory
    # and no LRU policy on purpose: evicting a queue key loses a job, so this
    # is a source of truth now, unlike when it was cache-only.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/music?schema=public
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-localhost}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      # Container-internal address, not the host-published 7081. Hardcoded on
      # purpose: `${PIPED_API_URL}` would interpolate the repo .env value, which
      # is the localhost URL the *host* uses and resolves to this container here.
      PIPED_API_URL: "http://piped-backend:8080"
      PIPED_FALLBACK_URLS: ""
      REDIS_URL: redis://redis:6379
      MEDIA_TEMP_DIR: /tmp/music-media
      MAX_DOWNLOAD_SIZE: "${MAX_DOWNLOAD_SIZE:-52428800}"
      MAX_DOWNLOAD_DURATION: "${MAX_DOWNLOAD_DURATION:-1800}"
      MAX_PLAYLIST_ITEMS: "${MAX_PLAYLIST_ITEMS:-50}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-600000}"
      QUEUE_ATTEMPTS: "${QUEUE_ATTEMPTS:-3}"
      QUEUE_BACKOFF_MS: "${QUEUE_BACKOFF_MS:-5000}"
    ports:
      - "4000:4000"
    volumes:
      - worker_tmp:/tmp/music-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/music?schema=public
      PIPED_API_URL: "http://piped-backend:8080"
      MEDIA_TEMP_DIR: /tmp/music-media
      FFMPEG_PATH: /usr/bin/ffmpeg
      YT_DLP_PATH: /usr/bin/yt-dlp
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-2}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-600000}"
      JOB_POLL_INTERVAL_MS: "${JOB_POLL_INTERVAL_MS:-2000}"
      MAX_DOWNLOAD_SIZE: "${MAX_DOWNLOAD_SIZE:-52428800}"
      MAX_DOWNLOAD_DURATION: "${MAX_DOWNLOAD_DURATION:-1800}"
    volumes:
      - worker_tmp:/tmp/music-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  piped-db:
    image: pgautoupgrade/pgautoupgrade:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: piped
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: piped
    volumes:
      - piped_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piped -d piped"]
      interval: 10s
      timeout: 5s
      retries: 5

  piped-bg-helper:
    image: 1337kavin/bg-helper-server:latest
    restart: unless-stopped

  piped-backend:
    image: 1337kavin/piped:latest
    restart: unless-stopped
    ports:
      - "7081:8080"
    volumes:
      - ./docker/piped/config.properties:/app/config.properties:ro
    depends_on:
      piped-db:
        condition: service_healthy

  piped-proxy:
    image: 1337kavin/piped-proxy:latest
    restart: unless-stopped
    ports:
      - "7082:8080"

  frontend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # VITE_* is inlined at build time, so this must be a build arg — an
        # `environment:` entry here would silently do nothing.
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4000/api/v1}"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  worker_tmp:
  piped_db_data:
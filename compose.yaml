name: music-stream

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Metadata cache only — every key carries a TTL and nothing here is a source
    # of truth, so evicting under pressure is correct rather than data loss.
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    ports:
      # Host port offset like postgres, so a Redis already running on the
      # default port is not shadowed by this one.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Production services (activate with: docker compose --profile prod up) ────

  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/music?schema=public
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-localhost}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/v1/auth/google/callback}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      PIPED_API_URL: "${PIPED_API_URL:-https://api.piped.private.coffee}"
      PIPED_FALLBACK_URLS: "${PIPED_FALLBACK_URLS}"
      REDIS_URL: redis://redis:6379
      MEDIA_TEMP_DIR: /tmp/music-media
      MAX_DOWNLOAD_SIZE: "${MAX_DOWNLOAD_SIZE:-52428800}"
      MAX_DOWNLOAD_DURATION: "${MAX_DOWNLOAD_DURATION:-1800}"
      MAX_PLAYLIST_ITEMS: "${MAX_PLAYLIST_ITEMS:-50}"
      DOWNLOAD_TOKEN_SECRET: "${DOWNLOAD_TOKEN_SECRET}"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/music?schema=public
      WORKER_PIPED_API_URL: "${PIPED_API_URL:-https://api.piped.private.coffee}"
      WORKER_MEDIA_TEMP_DIR: /tmp/music-media
      FFMPEG_PATH: /usr/bin/ffmpeg
      YT_DLP_PATH: /usr/bin/yt-dlp
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-2}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-600000}"
      JOB_POLL_INTERVAL_MS: "${JOB_POLL_INTERVAL_MS:-2000}"
      MAX_DOWNLOAD_SIZE: "${MAX_DOWNLOAD_SIZE:-52428800}"
      MAX_DOWNLOAD_DURATION: "${MAX_DOWNLOAD_DURATION:-1800}"
    volumes:
      - worker_tmp:/tmp/music-media
    depends_on:
      postgres:
        condition: service_healthy
    # Resource limits — hard caps to prevent runaway encoding from OOM'ing the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  worker_tmp:
